syntax = "proto3";

package systems.ajax.api.ecosystem.v2.hubsvc.commonmodels.device.common;

import "systems/ajax/api/ecosystem/v2/hubsvc/commonmodels/device/common/device_telemetry.proto";

option java_multiple_files = true;
option java_package = "systems.ajax.api.ecosystem.v2.hubsvc.commonmodels.device.common";
option swift_prefix = "";

message DeviceTelemetryPart {
  .systems.ajax.api.ecosystem.v2.hubsvc.commonmodels.device.common.DeviceTelemetry device_telemetry = 1;
  repeated .systems.ajax.api.ecosystem.v2.hubsvc.commonmodels.device.common.DeviceTelemetryPart.Capability capabilities = 2;
  .systems.ajax.api.ecosystem.v2.hubsvc.commonmodels.device.common.DeviceTelemetryPart.ConnectionType connection_type = 3;

  enum Capability {
    CAPABILITY_UNSPECIFIED = 0;
    CAPABILITY_DEVICE_SIGNAL_SUPPORTED = 1;
    CAPABILITY_CONNECTION_STATUS = 2;
  }

  enum ConnectionType {
    CONNECTION_TYPE_UNSPECIFIED = 0;
    CONNECTION_TYPE_JEWELLER = 1;
    CONNECTION_TYPE_FIBRA = 2;
    CONNECTION_TYPE_OTHER = 3;
  }
}
